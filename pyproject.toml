[build-system]
# >= 77 for PEP 639 SPDX `license` expressions
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yui-encoders"
# Single-sourced from `__version__.py` — see [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "Audio & text embedding models built on the `BaseModel` interface : a GE2E speaker encoder and a bge-m3 text encoder with a RAG layer (vector database + semantic search)"
readme = "README.md"
# Pinned to 3.12: like `base_dl_project`, this project needs a real keras backend
# (tensorflow / torch), and the backend wheels are what pin a full workstation to
# 3.12 — see INSTALLATION.md.
requires-python = "==3.12.*"
license = "AGPL-3.0-or-later"
license-files = ["LICENCE"]
authors = [{ name = "yui", email = "yui-mhcp@tutanota.com" }]
keywords = ["deep-learning", "keras", "embeddings", "speaker-verification", "information-retrieval", "rag", "tensorrt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

# Common `import utils` / `import loggers` / `import models` socle (eager + lazy).
# Deliberately free of keras / tensorflow / torch — pick a backend via the [tf] / [torch]
# extra. `scikit-learn` / `umap-learn` power the encoder evaluation (clustering) and the
# embeddings projection in `utils/plot_utils.py`.
dependencies = [
    "numpy",
    "tqdm",             # utils/file_utils.py
    "pyyaml",           # utils/file_utils.py
    "matplotlib",       # utils/plot_utils.py, re-exported by utils/__init__.py
    "requests",         # loggers/telegram_handler.py
    "h5py",             # utils/file_utils.py: hdf5 load/dump
    "msgspec",          # utils/file_utils.py: fast json (guarded by try/except)
    "scikit-learn",     # encoder clustering evaluation + utils/plot_utils.py
    "umap-learn",       # utils/plot_utils.py: embeddings projection
]

[project.urls]
Homepage = "https://github.com/yui-mhcp"
Repository = "https://github.com/yui-mhcp/encoders"
Changelog = "https://github.com/yui-mhcp/encoders/blob/main/CHANGELOG.md"
Issues = "https://github.com/yui-mhcp/encoders/issues"

[project.optional-dependencies]
# --- keras backends (mutually exclusive: pick the one matching your setup) ----
torch = [
    "keras>=3",
    "torch",
]
tf = [
    "keras>=3",
    "tensorflow",
]
# `[keras]` is an alias of `[tf]` (self-referencing extra, needs pip >= 21.2).
# Tied to [project].name: renaming the project breaks this alias.
keras = [
    "yui-encoders[tf]",
]

# `TextEncoder` (bge-m3) + the RAG layer (`models/encoder/rag.py`) : loading the
# pretrained transformer weights uses `transformers` / `huggingface_hub` (both lazy),
# the tokenizer uses `sentencepiece`, and document ingestion uses the text parsers.
text = [
    "transformers",
    "huggingface_hub",
    "sentencepiece",
    "regex",
    "unidecode",
    "num2words",
    "beautifulsoup4",
    "python-docx",
    "jinja2",
    "pypdfium2",
]
# `AudioEncoder` (speaker verification) : audio loading / processing helpers.
audio = [
    "librosa",
    "scipy",
    "pydub",
    "ffmpeg-python",
    "pyaudio",
    "audiofile",
    "moviepy<2",        # utils/audio/audio_io.py imports `moviepy.editor`, dropped in moviepy 2.x
    "ipython",          # notebook playback helpers
]
# Modality / dataset helpers used by the notebooks.
image = [
    "pillow",
    "opencv-python",
    "ffmpeg-python",
    "imageio",
    "networkx",
    "ipython",
]
datasets = [
    "pandas",
    "tensorflow-datasets",
]

dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist",
    "pytest-timeout",   # per-test deadlock guard (see [tool.pytest.ini_options].timeout)
]

[tool.setuptools.packages.find]
include = ["utils*", "loggers*", "models*", "architectures*", "custom_train_objects*"]

[tool.setuptools.dynamic]
version = { attr = "__version__.__version__" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
norecursedirs = [
    "data", "tmp", "__reproduction", "__pycache__", ".ipynb_checkpoints",
    "notebooks", "pretrained_models",
]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore"]
timeout = 60
markers = [
    "tensorflow: requires `tensorflow` to be installed (auto-skipped otherwise)",
    "keras: requires `keras` to be installed, e.g. to build tensors (auto-skipped otherwise)",
    "torch: requires `torch` to be installed (auto-skipped otherwise)",
    "cv2: requires `opencv-python` (cv2) to be installed (auto-skipped otherwise)",
    "gpu: requires a GPU to run",
    "slow: slow test (heavy models / long compute) — deselect with -m 'not slow'",
    "reproducibility: compares against a stored golden file",
]

[tool.coverage.run]
branch = true
source = ["utils", "models", "architectures", "loggers", "custom_train_objects"]
omit = ["tests/*", "*/notebooks/*", "*/pretrained_models/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
